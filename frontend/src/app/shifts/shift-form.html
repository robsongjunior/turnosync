<form class="panel" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <h2>{{ shift() ? 'Editar turno' : 'Nuevo turno' }}</h2>

  @if (formError(); as message) {
    <p class="banner banner-error" role="alert">{{ message }}</p>
  }

  <div class="form-grid">
    <label>
      Colaborador
      <select formControlName="employeeId">
        <option [ngValue]="0" disabled>Selecciona un colaborador</option>
        @for (employee of employees(); track employee.id) {
          <option [ngValue]="employee.id">{{ employee.name }} ({{ employee.countryCode }})</option>
        }
      </select>
      @if (showError('employeeId')) {
        <span class="field-error">Campo obligatorio</span>
      }
      @for (message of serverErrorsOf('employeeId'); track message) {
        <span class="field-error">{{ message }}</span>
      }
    </label>

    <label>
      Fecha
      <input type="date" formControlName="date" />
      @if (showError('date')) {
        <span class="field-error">Campo obligatorio</span>
      }
      @for (message of serverErrorsOf('date'); track message) {
        <span class="field-error">{{ message }}</span>
      }
    </label>

    <label>
      Inicio
      <input type="time" formControlName="startTime" />
      @if (showError('startTime')) {
        <span class="field-error">Campo obligatorio</span>
      }
      @for (message of serverErrorsOf('startTime'); track message) {
        <span class="field-error">{{ message }}</span>
      }
    </label>

    <label>
      Fin
      <input type="time" formControlName="endTime" />
      @if (showError('endTime')) {
        <span class="field-error">Campo obligatorio</span>
      }
      @if (form.hasError('sameTime') && form.controls.endTime.touched) {
        <span class="field-error">El fin debe ser distinto del inicio</span>
      }
      @for (message of serverErrorsOf('endTime'); track message) {
        <span class="field-error">{{ message }}</span>
      }
    </label>
  </div>

  <p class="hint">Una hora de fin anterior a la de inicio significa que el turno termina al día siguiente.</p>

  <div class="actions">
    <button type="submit" class="primary" [disabled]="submitting()">{{ submitting() ? 'Guardando…' : 'Guardar' }}</button>
    <button type="button" (click)="cancelled.emit()" [disabled]="submitting()">Cancelar</button>
  </div>
</form>
